# ════════════════════════════════════════════════════════
#  GitHub Actions — Scan Auto IPTV
#  Version : Premier Scan (Maximum Absolu 6 Heures)
# ════════════════════════════════════════════════════════

name: 🤖 Scan Auto IPTV

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scan:
    name: Scanner les chaînes IPTV
    runs-on: ubuntu-latest
    # 360 minutes est la limite maximale autorisée par GitHub
    timeout-minutes: 360 

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Lancer le scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scan.js

      - name: 📊 Résumé
        if: always()
        run: echo "✅ Scan terminé !"
