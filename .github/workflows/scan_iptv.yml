# ════════════════════════════════════════════════════════
#  GitHub Actions — Scan Auto IPTV
#  Lance scan.js automatiquement tous les jours à 6h UTC
#  (ou manuellement depuis l'onglet "Actions" de GitHub)
# ════════════════════════════════════════════════════════

name: 🤖 Scan Auto IPTV

on:
  # ── Planification automatique ──────────────────────────
  schedule:
    - cron: '0 6 * * *'    # Tous les jours à 6h00 UTC
    # Autres exemples :
    # - cron: '0 */12 * * *'  # Toutes les 12h
    # - cron: '0 6 * * 1'     # Tous les lundis à 6h

  # ── Lancement manuel depuis GitHub.com ─────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du scan manuel (optionnel)'
        required: false
        default: 'Scan manuel'

jobs:
  scan:
    name: Scanner les chaînes IPTV
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Arrêt forcé après 60 min

    steps:
      # 1. Télécharger le code du dépôt
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Configurer Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Lancer le scan
      #    Les secrets SUPABASE_URL et SUPABASE_KEY sont
      #    configurés dans Settings → Secrets → Actions
      - name: 🤖 Lancer le scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scan.js

      # 4. (Optionnel) Afficher un résumé dans l'interface GitHub
      - name: 📊 Résumé
        if: always()
        run: echo "✅ Scan terminé — voir les logs ci-dessus pour les détails"
