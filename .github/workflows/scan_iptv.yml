# ════════════════════════════════════════════════════════
#  GitHub Actions — Scan Auto IPTV
#  50 workers parallèles — ~31 min pour 31 000 chaînes
# ════════════════════════════════════════════════════════
name: 🤖 Scan Auto IPTV

on:
  # ── Planification automatique ──────────────────────────
  schedule:
    - cron: '0 6 * * *'     # Tous les jours à 6h00 UTC
    # Autres exemples :
    # - cron: '0 */12 * * *'   # Toutes les 12h
    # - cron: '0 6 * * 1'      # Tous les lundis à 6h

  # ── Lancement manuel depuis GitHub.com ─────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du scan manuel (optionnel)'
        required: false
        default: 'Scan manuel'

jobs:
  scan:
    name: Scanner les chaînes IPTV
    runs-on: ubuntu-latest
    timeout-minutes: 60     # ~31 min réel à 50 workers + marge confortable

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Lancer le scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scan.js

      - name: 📊 Résumé
        if: always()
        run: echo "✅ Scan terminé — voir les logs ci-dessus pour les détails"
