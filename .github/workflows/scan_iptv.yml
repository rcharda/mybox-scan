name: 🤖 Scan & Sync IPTV

on:
  schedule:
    # Se lance automatiquement chaque jour à 3h00 UTC (soit 4h00 au Bénin)
    - cron: '0 3 * * *'
  # Permet de lancer le scan manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  scan_job:
    name: Nettoyage et Synchronisation
    runs-on: ubuntu-latest
    # Sécurité : on laisse 120 minutes pour être large, même avec 31 000 chaînes
    timeout-minutes: 300 

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js (Version 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Exécution du Scan Turbo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scan.js

      - name: 📊 Résumé du Workflow
        if: always()
        run: echo "Le scan synchronisé est terminé !"
