# ════════════════════════════════════════════════════════
#  GitHub Actions — Scan Auto IPTV
#  50 workers — ~45 min pour 31 000 chaînes (timeout 8s)
# ════════════════════════════════════════════════════════
name: 🤖 Scan Auto IPTV

on:
  schedule:
    - cron: '0 6 * * *'    # Tous les jours à 6h00 UTC

  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du scan manuel (optionnel)'
        required: false
        default: 'Scan manuel'

jobs:
  scan:
    name: Scanner les chaînes IPTV
    runs-on: ubuntu-latest
    timeout-minutes: 200     # ✅ 90 min (était 60 — timeout 8s = ~45 min réel + marge)

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Lancer le scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scan.js

      - name: 📊 Résumé
        if: always()
        run: echo "✅ Scan terminé — voir les logs ci-dessus"
